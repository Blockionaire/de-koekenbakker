# Het weekoverzicht van de bestellingen, donderdagavond.
#
# GitHub plant taken in UTC, houdt geen rekening met zomertijd en zet ze op een
# gedeelde wachtrij. In november startten ze vier tot vijf uur te laat, waardoor
# het in Nederland al vrijdag was en het bericht helemaal niet meer wegging.
#
# Daarom staan de tijden nu ruim: om de twee uur van donderdagmiddag tot
# vrijdagochtend. Het script kijkt zelf of het binnen het verzendvenster valt
# (donderdag vanaf 18:00 tot vrijdag 12:00 Nederlandse tijd) en of het bericht
# van deze week al weg is. Zo komt hij altijd, ook bij een flinke vertraging,
# en nooit dubbel.
name: Weekbericht

on:
  schedule:
    # donderdag, Nederlandse avond
    - cron: "0 16 * * 4"
    - cron: "0 18 * * 4"
    - cron: "0 20 * * 4"
    - cron: "0 22 * * 4"
    # vrijdagnacht en -ochtend: het vangnet als GitHub uren te laat is
    - cron: "0 0 * * 5"
    - cron: "0 2 * * 5"
    - cron: "0 5 * * 5"
    - cron: "0 7 * * 5"
  workflow_dispatch:        # met de hand draaien kan ook
    inputs:
      forceer:
        description: "Nu versturen, ook als het geen donderdagavond is"
        type: boolean
        default: true

jobs:
  versturen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests google-auth
      - run: python scripts/weekbericht.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          MAIL_AFZENDER: ${{ secrets.MAIL_AFZENDER }}
          MAIL_WACHTWOORD: ${{ secrets.MAIL_WACHTWOORD }}
          MAIL_ONTVANGERS: ${{ secrets.MAIL_ONTVANGERS }}
          FORCEER: ${{ github.event_name == 'workflow_dispatch' && 'ja' || 'nee' }}
