# Het weekoverzicht van de bestellingen, elke donderdagavond om 20:00.
#
# GitHub plant taken in UTC, houdt geen rekening met zomertijd en start ze soms
# een half uur tot een uur te laat. Daarom draait deze taak donderdagavond een
# paar keer achter elkaar. Het script kijkt zelf of het in Nederland al na 20:00
# is en of het bericht van deze week al weg is, dus hij komt altijd en nooit
# dubbel.
name: Weekbericht

on:
  schedule:
    - cron: "0 18 * * 4"   # 20:00 in de zomertijd
    - cron: "30 18 * * 4"
    - cron: "0 19 * * 4"   # 20:00 in de wintertijd
    - cron: "30 19 * * 4"
    - cron: "0 20 * * 4"   # vangnet als GitHub laat is
  workflow_dispatch:        # met de hand draaien kan ook
    inputs:
      forceer:
        description: "Nu versturen, ook als het geen donderdagavond is"
        type: boolean
        default: true

jobs:
  versturen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests google-auth
      - run: python scripts/weekbericht.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          MAIL_AFZENDER: ${{ secrets.MAIL_AFZENDER }}
          MAIL_WACHTWOORD: ${{ secrets.MAIL_WACHTWOORD }}
          MAIL_ONTVANGERS: ${{ secrets.MAIL_ONTVANGERS }}
          FORCEER: ${{ github.event_name == 'workflow_dispatch' && 'ja' || 'nee' }}
