# Het weekoverzicht van de bestellingen, elke donderdagavond om 20:00.
#
# GitHub plant taken in UTC en houdt geen rekening met zomertijd. Daarom draait
# deze taak twee keer (18:00 en 19:00 UTC) en kijkt het script zelf hoe laat het
# in Nederland is; alleen om 20:00 Nederlandse tijd stuurt hij het bericht.
name: Weekbericht

on:
  schedule:
    - cron: "0 18 * * 4"   # donderdag, zomertijd
    - cron: "0 19 * * 4"   # donderdag, wintertijd
  workflow_dispatch:        # met de hand draaien kan ook
    inputs:
      forceer:
        description: "Nu versturen, ook als het geen donderdagavond is"
        type: boolean
        default: true

jobs:
  versturen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests google-auth
      - run: python scripts/weekbericht.py
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          MAIL_AFZENDER: ${{ secrets.MAIL_AFZENDER }}
          MAIL_WACHTWOORD: ${{ secrets.MAIL_WACHTWOORD }}
          MAIL_ONTVANGERS: ${{ secrets.MAIL_ONTVANGERS }}
          FORCEER: ${{ github.event_name == 'workflow_dispatch' && 'ja' || 'nee' }}
